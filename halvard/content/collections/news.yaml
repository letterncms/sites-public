title: News
singular: Story
icon: newspaper
driver: database
structure: dated
route: '/news/{slug}'
template: article
sort: '-published_at'
nav_order: 40
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: cover
    type: media
    label: Cover
    max: 1
    accept: 'image/*'
    section: sidebar
  -
    handle: topic
    type: terms
    label: Topic
    taxonomy: topics
    max: 1
    section: sidebar
  -
    handle: specialties
    type: entries
    label: Specialties
    collections:
      - specialties
    section: sidebar
