title: Vacancies
singular: Vacancy
icon: briefcase
driver: database
structure: dated
route: '/careers/{slug}'
template: job
sort: '-published_at'
default_columns:
  - 'field:field'
  - 'field:hours'
  - status
nav_order: 55
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: field
    type: select
    label: 'Job Family'
    options:
      nursing: 'Nursing and midwifery'
      medical: Medical
      allied: 'Allied health'
      support: 'Support services'
    required: true
    section: sidebar
  -
    handle: department
    type: text
    label: Department
    section: sidebar
  -
    handle: hours
    type: select
    label: Hours
    options:
      full: 'Full time'
      part: 'Part time'
      flexible: 'Full or part time'
    section: sidebar
  -
    handle: contract
    type: select
    label: Contract
    options:
      permanent: Permanent
      fixed: 'Fixed term'
      student: 'Student job'
    section: sidebar
  -
    handle: salary
    type: text
    label: Salary
    section: sidebar
