title: Vacancies
singular: Vacancy
icon: briefcase
driver: database
structure: dated
route: '/careers/{slug}'
template: job
sort: '-published_at'
default_columns:
  - 'field:field'
  - 'field:hours'
  - status
nav_order: 55
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: field
    type: select
    label: 'Job Family'
    options:
      'Nursing and midwifery': 'Nursing and midwifery'
      Medical: Medical
      'Allied health': 'Allied health'
      'Support services': 'Support services'
    required: true
    section: sidebar
  -
    handle: department
    type: text
    label: Department
    section: sidebar
  -
    handle: hours
    type: select
    label: Hours
    options:
      'Full time': 'Full time'
      'Part time': 'Part time'
      'Full or part time': 'Full or part time'
    section: sidebar
  -
    handle: contract
    type: select
    label: Contract
    options:
      Permanent: Permanent
      'Fixed term': 'Fixed term'
      'Student job': 'Student job'
    section: sidebar
  -
    handle: salary
    type: text
    label: Salary
    section: sidebar
