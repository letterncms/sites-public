title: 'Conditions and Treatments'
singular: 'Condition or Treatment'
icon: first-aid-kit
description: 'Conditions, treatments and tests explained for patients, A to Z.'
driver: database
structure: list
route: '/conditions/{slug}'
template: condition
sort: title
default_columns:
  - 'field:kind'
  - 'field:specialties'
  - status
nav_order: 35
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: kind
    type: select
    label: Kind
    required: true
    options:
      condition: Condition
      treatment: Treatment
      test: 'Test or scan'
    default: condition
    section: sidebar
  -
    handle: also_known_as
    type: text
    label: 'Also Known As'
    section: sidebar
  -
    handle: specialties
    type: entries
    label: 'Treated By'
    collections:
      - specialties
    section: sidebar
  -
    handle: keywords
    type: list
    label: Keywords
    about: 'Other words people search for it by, like heart for Cardiology.'
    section: sidebar
