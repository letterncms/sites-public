title: Doctors
singular: Doctor
icon: user-circle
description: 'Doctors, midwives, nurses and therapists patients can see by name.'
driver: database
structure: list
route: '/doctors/{slug}'
template: doctor
sort: family_name
default_view: grid
default_columns:
  - 'field:photo'
  - 'field:role'
  - 'field:specialties'
  - 'field:new_patients'
nav_order: 30
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Biography
  -
    handle: honorific
    type: select
    label: Title
    options:
      Dr: Dr
      'Prof. Dr': 'Prof. Dr'
    width: half
  -
    handle: family_name
    type: text
    label: 'Family Name'
    required: true
    about: 'The list of doctors is sorted by it.'
    width: half
  -
    handle: role
    type: text
    label: Role
    required: true
    about: 'What patients see them for, like Cardiologist or Midwife.'
  -
    handle: photo
    type: media
    label: Photo
    max: 1
    accept: 'image/*'
    section: sidebar
  -
    handle: specialties
    type: entries
    label: Specialties
    collections:
      - specialties
    section: sidebar
  -
    handle: new_patients
    type: toggle
    label: 'Sees New Patients'
    default: true
    section: sidebar
  -
    handle: expertise
    type: list
    label: Expertise
    about: 'What they specialise in, a few words each.'
  -
    handle: languages
    type: list
    label: 'Languages Spoken'
  -
    handle: clinics
    type: textarea
    label: 'Consultation Hours'
  -
    handle: education
    type: textarea
    label: 'Training and Qualifications'
