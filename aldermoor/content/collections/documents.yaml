title: Documents
singular: Document
icon: file-text
description: 'Plans, reports, budgets, agendas and minutes.'
driver: database
structure: dated
route: '/documents/{slug}'
template: document
nav_order: 17
default_columns:
  - 'field:kind'
  - published
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: kind
    type: select
    label: Kind
    required: true
    options:
      Plan: Plan
      Report: Report
      Budget: Budget
      Policy: Policy
      'Agenda and minutes': 'Agenda and minutes'
    section: sidebar
  -
    handle: file
    type: file
    label: File
    max: 1
  -
    handle: format_note
    type: text
    label: 'Other Formats'
    placeholder: 'Ask for this in large print, Braille or Easy Read.'
