title: Places
singular: Place
icon: map-pin
description: 'City Hall, service points and the city’s public buildings.'
driver: database
structure: list
route: '/places/{slug}'
template: place
sort: title
nav_order: 16
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: kind
    type: select
    label: Kind
    section: sidebar
    options:
      'Service point': 'Service point'
      'Recycling centre': 'Recycling centre'
      Library: Library
      'Sport and swimming': 'Sport and swimming'
      Culture: Culture
  -
    handle: address
    type: textarea
    label: Address
    width: half
  -
    handle: location
    type: geo
    label: 'Map Position'
    width: half
  -
    handle: phone
    type: text
    label: Phone
    width: half
  -
    handle: email
    type: email
    label: Email
    width: half
  -
    handle: hours
    type: table
    label: 'Opening Hours'
    header: false
    instructions: 'One row a day: the day, then the hours.'
  -
    handle: hours_note
    type: text
    label: 'About the Hours'
    placeholder: 'Closed on public holidays.'
  -
    handle: access
    type: list
    label: Accessibility
    instructions: 'One line each: step-free entrance, accessible toilet, hearing loop…'
  -
    handle: photo
    type: media
    label: Photo
    max: 1
    accept: 'image/*'
