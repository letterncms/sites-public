title: People
singular: Person
icon: users-three
description: 'The mayor, the executive and the city councillors.'
driver: database
structure: list
route: '/council/people/{slug}'
template: person
sort: position
nav_order: 15
default_columns:
  - 'field:role'
  - 'field:ward'
  - 'field:photo'
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: role
    type: select
    label: Role
    required: true
    default: Councillor
    options:
      Mayor: Mayor
      'Deputy mayor': 'Deputy mayor'
      Councillor: Councillor
      'Chief executive': 'Chief executive'
  -
    handle: portfolio
    type: text
    label: 'Responsible For'
  -
    handle: ward
    type: text
    label: Ward
    width: half
  -
    handle: since
    type: text
    label: 'In Office Since'
    width: half
  -
    handle: email
    type: email
    label: Email
    width: half
  -
    handle: phone
    type: text
    label: Phone
    width: half
  -
    handle: photo
    type: media
    label: Photo
    max: 1
    accept: 'image/*'
  -
    handle: summary
    type: textarea
    label: Summary
