title: Pages
singular: Page
icon: file
driver: database
structure: tree
route: '/{parent_uri}/{slug}'
template: page
sort: position
home: home
nav_order: 10
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    instructions: 'One or two plain sentences under the title. Also shown in search results and lists.'
    section: sidebar
  -
    handle: template
    type: select
    label: Template
    dynamic: templates
    section: sidebar
  -
    handle: keywords
    type: text
    label: 'Search Words'
    instructions: 'Other words people use for this page, so search finds it.'
    section: sidebar
