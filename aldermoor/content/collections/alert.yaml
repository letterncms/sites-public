type: global
title: Alert
icon: warning
description: 'A message at the top of every page, for disruption or an emergency.'
driver: files
fields:
  -
    handle: show
    type: toggle
    label: 'Show the Alert'
  -
    handle: tone
    type: select
    label: Tone
    default: notice
    options:
      notice: Notice
      warning: Disruption
      urgent: Emergency
  -
    handle: message
    type: text
    label: Message
    max: 160
  -
    handle: link
    type: link
    label: Link
