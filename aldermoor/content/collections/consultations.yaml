title: Consultations
singular: Consultation
icon: megaphone
description: 'Plans the council asks residents about.'
driver: database
structure: dated
route: '/have-your-say/{slug}'
template: consultation
nav_order: 14
default_columns:
  - 'field:state'
  - 'field:closes'
  - status
fields:
  -
    handle: content
    type: blocks
    body: true
    label: Content
  -
    handle: summary
    type: textarea
    label: Summary
    required: true
  -
    handle: state
    type: select
    label: State
    required: true
    default: Open
    options:
      Open: Open
      Closed: Closed
      'Outcome published': 'Outcome published'
    section: sidebar
  -
    handle: closes
    type: date
    label: Closes
    section: sidebar
  -
    handle: cover
    type: media
    label: Photo
    max: 1
    accept: 'image/*'
  -
    handle: topic
    type: terms
    label: Topic
    taxonomy: topics
    max: 1
    section: sidebar
