type: global
title: Melding
icon: warning
description: 'Een melding bovenaan elke pagina, bij hinder of een noodsituatie.'
fields:
  -
    handle: show
    type: toggle
    label: 'Melding tonen'
  -
    handle: tone
    type: select
    label: Soort
    default: notice
    options:
      notice: Info
      warning: Hinder
      urgent: Noodsituatie
  -
    handle: message
    type: text
    label: Bericht
    max: 160
  -
    handle: link
    type: link
    label: Link
driver: files
