title: Zorgaanbod
singular: Dienst
icon: stethoscope
description: 'De diensten, centra en raadplegingen van het ziekenhuis.'
driver: database
structure: list
route: '/zorgaanbod/{slug}'
template: specialty
sort: title
default_columns:
  - 'field:kind'
  - 'field:area'
  - 'field:phone'
  - status
nav_order: 20
fields:
  -
    handle: content
    type: blocks
    label: Inhoud
    body: true
  -
    handle: summary
    type: textarea
    label: Samenvatting
    required: true
    about: 'Eén zin over wat de dienst doet, op de kaart en onder de titel.'
  -
    handle: kind
    type: select
    label: Soort
    options:
      dienst: Dienst
      centrum: Centrum
      raadpleging: Raadpleging
    default: dienst
    required: true
    section: sidebar
  -
    handle: area
    type: terms
    label: Zorgdomein
    taxonomy: areas
    max: 1
    required: true
    section: sidebar
  -
    handle: icon
    type: icon
    label: Icoon
    section: sidebar
  -
    handle: cover
    type: media
    label: Foto
    max: 1
    accept: 'image/*'
    section: sidebar
  -
    handle: phone
    type: text
    label: 'Telefoon afspraken'
    section: sidebar
  -
    handle: location
    type: text
    label: Waar
    about: 'Campus, gebouw en route, zoals de bewegwijzering het zegt.'
    section: sidebar
  -
    handle: hours
    type: textarea
    label: Openingsuren
    section: sidebar
  -
    handle: referral
    type: toggle
    label: 'Verwijsbrief nodig'
    about: 'Aan wanneer je een verwijsbrief van je huisarts nodig hebt voor een eerste afspraak.'
    section: sidebar
  -
    handle: online
    type: toggle
    label: 'Online afspraak'
    about: 'Aan wanneer patiënten online een afspraak kunnen maken.'
    section: sidebar
  -
    handle: keywords
    type: list
    label: Zoekwoorden
    about: 'Andere woorden waarop mensen zoeken, zoals hart voor Cardiologie.'
    section: sidebar
