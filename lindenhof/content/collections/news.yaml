title: Nieuws
singular: Bericht
icon: newspaper
driver: database
structure: dated
route: '/nieuws/{slug}'
template: article
sort: '-published_at'
nav_order: 40
fields:
  -
    handle: content
    type: blocks
    label: Inhoud
    body: true
  -
    handle: summary
    type: textarea
    label: Samenvatting
    required: true
  -
    handle: cover
    type: media
    label: Foto
    max: 1
    accept: 'image/*'
    section: sidebar
  -
    handle: topic
    type: terms
    label: Thema
    taxonomy: topics
    max: 1
    section: sidebar
  -
    handle: specialties
    type: entries
    label: Diensten
    collections:
      - specialties
    section: sidebar
