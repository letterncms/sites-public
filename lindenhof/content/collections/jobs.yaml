title: Vacatures
singular: Vacature
icon: briefcase
driver: database
structure: dated
route: '/jobs/{slug}'
template: job
sort: '-published_at'
default_columns:
  - 'field:field'
  - 'field:hours'
  - status
nav_order: 55
fields:
  -
    handle: content
    type: blocks
    label: Inhoud
    body: true
  -
    handle: summary
    type: textarea
    label: Samenvatting
    required: true
  -
    handle: field
    type: select
    label: Domein
    options:
      verpleging: 'Verpleging en vroedkunde'
      medisch: Medisch
      paramedisch: Paramedisch
      ondersteuning: Ondersteuning
    required: true
    section: sidebar
  -
    handle: department
    type: text
    label: Dienst
    section: sidebar
  -
    handle: hours
    type: select
    label: Uren
    options:
      voltijds: Voltijds
      deeltijds: Deeltijds
      beide: 'Voltijds of deeltijds'
    section: sidebar
  -
    handle: contract
    type: select
    label: Contract
    options:
      onbepaald: 'Onbepaalde duur'
      bepaald: 'Bepaalde duur'
      student: Studentenjob
    section: sidebar
  -
    handle: salary
    type: text
    label: Verloning
    section: sidebar
