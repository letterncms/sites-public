title: Campussen
singular: Campus
icon: map-pin
driver: database
structure: list
route: '/campussen/{slug}'
template: location
sort: position
nav_order: 60
fields:
  -
    handle: content
    type: blocks
    label: Inhoud
    body: true
  -
    handle: summary
    type: textarea
    label: Samenvatting
    required: true
  -
    handle: cover
    type: media
    label: Foto
    max: 1
    accept: 'image/*'
    section: sidebar
  -
    handle: address
    type: textarea
    label: Adres
    required: true
  -
    handle: place
    type: geo
    label: 'Op de kaart'
    about: 'Waar het is, voor de link naar de routebeschrijving.'
  -
    handle: phone
    type: text
    label: Telefoon
    width: half
  -
    handle: hours
    type: textarea
    label: Openingsuren
    width: half
  -
    handle: getting_there
    type: textarea
    label: 'Met het openbaar vervoer'
  -
    handle: parking
    type: textarea
    label: 'Met de wagen'
